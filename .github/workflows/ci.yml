name: CI (functions)

# Verifie le hub leads/contact (functions/) sur chaque PR et sur main.
# Le job `functions` est un check requis sur main: sans lui, `functions/`
# n'etait verifie par aucune CI (les tests ne tournaient qu'en local).
# Un workflow requis ne doit pas etre filtre par `paths:` (un run "skipped"
# laisse le check en attente); ce job est rapide (~40 s), il tourne toujours.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix functions

      - name: Lint
        run: npm --prefix functions run lint

      - name: Unit tests
        run: npm --prefix functions test
