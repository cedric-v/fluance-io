name: CI (functions)

# Verifie le hub leads/contact (functions/) sur chaque PR et sur main.
# Le job `functions` est un check requis sur main: sans lui, `functions/`
# n'etait verifie par aucune CI (les tests ne tournaient qu'en local).
# Un workflow requis ne doit pas etre filtre par `paths:` (un run "skipped"
# laisse le check en attente); ce job est rapide (~40 s), il tourne toujours.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # Garde-fou anti "commit partiel" : echoue si un fichier de functions/ a ete
      # supprime alors qu'un require()/import le reference encore. Sans lui, lint
      # et tests passent mais le deploiement echoue a l'analyse du code
      # (MODULE_NOT_FOUND: bexioService, 2 nov. 2026). Aucune dependance requise.
      - name: Verifier les require() locaux de functions/
        run: npm run verify:requires

      - name: Install dependencies
        run: npm ci --prefix functions

      - name: Audit des dépendances du site (vulnérabilités connues)
        # Meme exigence qu'avant (aucune vulnérabilité high/critical tolérée),
        # mais les exceptions doivent être datées et justifiées dans
        # scripts/audit-allowlist.json, et une exception expirée casse le job.
        # Sans cela, un avis sans correctif amont (cas picomatch / CVE-2026-112366)
        # bloque toutes les PR, y compris celles qui n'ont aucun rapport.
        run: node scripts/audit-gate.mjs

      - name: Audit des dépendances des functions
        run: npm audit --prefix functions --audit-level=high

      - name: Lint
        run: npm --prefix functions run lint

      - name: Unit tests
        run: npm --prefix functions test
