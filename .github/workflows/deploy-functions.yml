name: Deploy functions

# Deploiement des Cloud Functions depuis la CI (au lieu du laptop).
#
# Pourquoi:
# - la configuration deployee est toujours celle du code (un `maxInstances`
#   oublie dans le code repasse au defaut GCP: c'est arrive le 1er novembre
#   2026, voir docs/leads-runbook.md);
# - aucun secret long-duree dans GitHub: authentification par Workload
#   Identity Federation (jeton OIDC GitHub echange contre des credentials
#   GCP temporaires). Aucune cle JSON de compte de service n'est stockee.
#
# declenchement:
# - push sur main qui touche functions/ (ou les templates d'emails) -> deploiement
# - workflow_dispatch -> deploiement manuel (utile pour un rollback ou apres
#   un changement hors git)
#
# Securite:
# - `id-token: write` est requis pour OIDC, `contents: read` suffit pour le reste
# - l'eligibilite du compte de service est restreinte au depot
#   (attribut `repository=cedric-v/fluance-io`) cote Google Cloud
# - l'environnement `production` peut exiger une approbation (voir README du
#   runbook) sans bloquer les deploiements automatiques si non configure
#
# Le deploiement est decoupe en lots (voir l'etape "Deploy functions"): le
# quota GCP de mutations par minute et par region est depasse si les 75
# fonctions sont mises a jour d'un seul coup (incident du 10 novembre 2026).

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/emails/**'
      - 'scripts/build-email-templates.js'
      - 'scripts/lib/deployed-functions.mjs'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Fonctions a deploiement (vide = toutes)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-functions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-latest
    # Environnement protege: facultatif cote GitHub, mais c'est le bon
    # endroit pour une approbation manuelle avant deploiement en production.
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies (functions)
        run: npm ci --prefix functions

      - name: "Install dependencies (racine: scripts de build des emails)"
        run: npm ci

      - name: Lint
        run: npm --prefix functions run lint

      - name: Unit tests
        run: npm --prefix functions test

      # Workload Identity Federation: echange du jeton OIDC GitHub contre des
      # credentials GCP temporaires. `create_credentials_file` produit un
      # fichier que la CLI Firebase et gcloud utilisent via
      # GOOGLE_APPLICATION_CREDENTIALS.
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build email templates
        run: npm run build:email-templates

      # Cible de deploiement la plus etroite possible:
      # - seul functions/blogLeadHub.js change -> les 2 fonctions HTTP du hub
      # - functions/runtimeConfig.js change -> toutes les fonctions (il porte
      #   le dimensionnement global)
      # - functions/index.js ou un autre fichier de functions/ (emails, services)
      #   -> toutes les fonctions (les emails sont utilises par de nombreuses
      #      fonctions, les services par toutes)
      # - rien d'exploitable -> toutes (plus prudent)
      # L'input manuel `functions` du workflow_dispatch reste prioritaire.
      - name: Compute deployment targets
        id: targets
        run: |
          if [ -n "${{ inputs.functions }}" ]; then
            echo "targets=${{ inputs.functions }}" >> "$GITHUB_OUTPUT"
            echo "Cible (manuelle): ${{ inputs.functions }}"
            exit 0
          fi
          CHANGED="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- functions/ 2>/dev/null || true)"
          if [ -z "$CHANGED" ]; then
            CHANGED="$(git diff --name-only HEAD~1 HEAD -- functions/ 2>/dev/null || true)"
          fi
          echo "Fichiers modifies: $CHANGED"
          ONLY_HUB=1
          ALL_FUNCTIONS=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # runtimeConfig.js porte le dimensionnement de TOUTES les
              # fonctions (hub, API de reservation, fonctions planifiees):
              # un changement ici impose un deploiement complet.
              functions/runtimeConfig.js) ALL_FUNCTIONS=1 ;;
              functions/blogLeadHub.js) ;;
              *) ONLY_HUB=0 ;;
            esac
          done <<< "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "targets=functions" >> "$GITHUB_OUTPUT"
            echo "Cible: toutes les functions (aucun diff exploitable)"
          elif [ "$ALL_FUNCTIONS" = "1" ]; then
            echo "targets=functions" >> "$GITHUB_OUTPUT"
            echo "Cible: toutes les functions (runtimeConfig.js modifie)"
          elif [ "$ONLY_HUB" = "1" ]; then
            echo "targets=functions:captureLead,functions:sendContactEmail" >> "$GITHUB_OUTPUT"
            echo "Cible: fonctions HTTP du hub (blogLeadHub.js)"
          else
            echo "targets=functions" >> "$GITHUB_OUTPUT"
            echo "Cible: toutes les functions (autre fichier de functions/ modifie)"
          fi

      # Deploiement par lots (et non en un seul `firebase deploy --only functions`).
      #
      # Pourquoi: le quota GCP "Per project mutation requests per minute per
      # region" est atteint quand les 75 fonctions sont mises a jour d'un coup.
      # Le deploiement echoue alors avec `429 Quota exceeded`, et le job Cloud
      # Scheduler d'une fonction peut etre mis a jour avec une URI vide
      # (`400 URL cannot be empty`) -> le run est en echec alors que le
      # deploiement est fonctionnel (incident du 10 novembre 2026).
      #
      # Le deploiement est donc decoupe en lots de 15 fonctions, avec une
      # pause entre les lots (le quota est par minute) et 3 tentatives par
      # lot en cas d'erreur transitoire.
      - name: Deploy functions
        env:
          FIREBASE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          TARGETS: ${{ steps.targets.outputs.targets }}
          FIREBASE_TOOLS_VERSION: '15.35.0'
          BATCH_SIZE: '15'
          BATCH_PAUSE_SECONDS: '45'
          DEPLOY_RETRIES: '3'
        run: |
          set -uo pipefail

          deploy_batch() {
            local targets="$1"
            local attempt=1
            while true; do
              echo "::group::firebase deploy --only ${targets} (tentative ${attempt}/${DEPLOY_RETRIES})"
              if npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" deploy \
                  --only "$targets" \
                  --project "$FIREBASE_PROJECT" \
                  --non-interactive; then
                echo "::endgroup::"
                return 0
              fi
              echo "::endgroup::"
              if [ "$attempt" -ge "$DEPLOY_RETRIES" ]; then
                echo "❌ Echec du deploiement de ${targets} apres ${attempt} tentatives"
                return 1
              fi
              attempt=$((attempt + 1))
              echo "⏳ Nouvelle tentative dans $((60 * attempt)) s (quota par minute)..."
              sleep $((60 * attempt))
            done
          }

          if [ "$TARGETS" != "functions" ]; then
            # Cible manuelle (ou hub seul): un seul appel suffit.
            deploy_batch "$TARGETS" || exit 1
            exit 0
          fi

          ALL="$(node scripts/lib/deployed-functions.mjs --format csv)"
          if [ -z "$ALL" ]; then
            echo "❌ Aucune fonction detectee dans functions/."
            exit 1
          fi
          IFS=',' read -r -a NAMES <<< "$ALL"
          TOTAL="${#NAMES[@]}"
          echo "📦 ${TOTAL} fonctions a deployer, par lots de ${BATCH_SIZE}"

          index=0
          lot=1
          while [ "$index" -lt "$TOTAL" ]; do
            chunk=("${NAMES[@]:index:BATCH_SIZE}")
            targets=""
            for name in "${chunk[@]}"; do
              targets="${targets}functions:${name},"
            done
            targets="${targets%,}"

            echo "➡️  Lot ${lot} (${#chunk[@]} fonctions): ${chunk[*]}"
            deploy_batch "$targets" || exit 1

            index=$((index + BATCH_SIZE))
            lot=$((lot + 1))
            if [ "$index" -lt "$TOTAL" ]; then
              echo "⏸️  Pause de ${BATCH_PAUSE_SECONDS} s (quota de mutations par minute)"
              sleep "$BATCH_PAUSE_SECONDS"
            fi
          done

          echo "✅ ${TOTAL} fonctions deployees en $((lot - 1)) lot(s)"

      # Verifie que la configuration REELLEMENT deployee (memoire, min/max
      # instances) correspond a functions/runtimeConfig.js. C'est le garde-fou
      # contre la derive de configuration.
      - name: Verify deployed runtime
        env:
          GCLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: node scripts/verify-functions-runtime.mjs --project "${{ vars.GCP_PROJECT_ID }}"
