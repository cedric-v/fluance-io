name: Deploy API proxy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'

      - name: Unit tests
        run: npm --prefix cloudflare/api-proxy test

      - name: Validate API contract
        run: node scripts/validate-api-contract.mjs

      - name: Generate discovery resources for the Worker
        run: node scripts/generate-api-proxy-discovery.mjs

      - name: Deploy Cloudflare API Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CF_WORKER_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config cloudflare/api-proxy/wrangler.toml
