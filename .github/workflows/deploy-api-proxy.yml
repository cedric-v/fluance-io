name: Deploy API proxy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate discovery resources for the Worker
        run: node scripts/generate-api-proxy-discovery.mjs

      - name: Deploy Cloudflare API Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_WORKER_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config cloudflare/api-proxy/wrangler.toml
