name = "fluance-api-proxy"
main = "src/index.js"
compatibility_date = "2026-08-25"
workers_dev = false

# The Worker takes precedence over the Cloudflare Pages project only for
# machine-facing API routes. The rest of fluance.io remains on Pages.
routes = [
  { pattern = "fluance.io/api/*", zone_name = "fluance.io" },
  { pattern = "www.fluance.io/api/*", zone_name = "fluance.io" }
]

[vars]
BACKEND_ORIGIN = "https://europe-west1-fluance-protected-content.cloudfunctions.net"
